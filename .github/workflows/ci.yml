name: CI

on:
  push:
    branches: [main, backend, frontend, docs, devops]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (fmt, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned submodules
        run: make install

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: forge fmt --check
        run: make fmt-check

      - name: forge build
        run: make build

      - name: forge test
        run: make test

  web:
    name: Web (lint, typecheck, unit, smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
